[package]
name = "spacevision-desktop"
version = "1.0.5"
description = "SpaceVision DVR edge desktop"
authors = ["SpaceVision"]
edition = "2021"

[lib]
name = "spacevision_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
