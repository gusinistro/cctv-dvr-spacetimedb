name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "client/src/lib/spacetimedb-bindings/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native installers
        run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceVision-Desktop-${{ matrix.name }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
