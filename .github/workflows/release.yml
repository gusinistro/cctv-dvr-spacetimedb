name: Versioned release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release existente, por exemplo v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" version list
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate web and security
        run: pnpm check && pnpm test && pnpm audit --prod --audit-level high
      - name: Validate SpacetimeDB module
        run: pnpm spacetime:build

  desktop-packages:
    name: Package desktop (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native installers
        run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceVision-${{ matrix.name }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: desktop-packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: find release-artifacts -type f -print0 | xargs -0 gh release create "$RELEASE_TAG" --title "SpaceVision DVR $RELEASE_TAG" --generate-notes
